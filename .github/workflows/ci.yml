name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  RENODE_VERSION: 1.16.1
  SEED: 20260812

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi

      - name: Build firmware
        run: make -C firmware

      - name: Report firmware size
        run: make -C firmware size

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Renode
        id: cache-renode
        uses: actions/cache@v4
        with:
          path: renode
          key: renode-${{ env.RENODE_VERSION }}-linux-portable-dotnet

      - name: Download Renode
        if: steps.cache-renode.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable-dotnet.tar.gz"
          mkdir -p renode
          tar xf renode.tar.gz -C renode --strip-components=1

      - name: Install test dependencies
        run: pip install -r renode/tests/requirements.txt

      # Deliberately goes through scripts/test.sh rather than calling renode-test
      # directly: the path documented in the README is the path CI proves.
      - name: Run Renode test suite
        env:
          RENODE_DIR: ${{ github.workspace }}/renode
        run: scripts/test.sh

      # The measurement the headline claim rests on. No rate is asserted yet -
      # the first job of this step is to find out what the rate actually is.
      - name: Measure race failure rate
        env:
          RENODE_DIR: ${{ github.workspace }}/renode
        run: |
          python tools/campaign.py \
            --count 200 \
            --jobs 4 \
            --report build/campaign.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: |
            report.html
            log.html
            robot_output.xml
            logs/
            snapshots/
            build/campaign.json
          if-no-files-found: ignore
