name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sweep:
        description: 'Sweep CONTROL_WORK instead of running a single campaign'
        type: boolean
        default: false
      count:
        description: 'Seeds per measurement point'
        default: '400'

# The repository default is already read-only, but a workflow should not depend
# on a setting someone can change from a web page.
permissions:
  contents: read

env:
  RENODE_VERSION: 1.16.1
  # SHA-256 of renode-1.16.1.linux-portable-dotnet.tar.gz, from the GitHub
  # release asset digest. CI executes this archive, so it is verified before it
  # is unpacked rather than trusted because the URL looked right.
  RENODE_SHA256: 00e113cdbd0f5354cf2f64bbe3f5a070d8958409542fca66e45ac97d982938c0
  # Single source of truth for the seed. scripts/test.sh passes it through to
  # the Robot suites, which read it from the environment rather than repeating
  # the number.
  SEED: 20260812

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to point
      # at different code without anything here changing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi

      - name: Build firmware
        run: make -C firmware

      - name: Report firmware size
        run: make -C firmware size

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # Runs before anything is downloaded: these need only Python, and they are
      # what proves the comparator can reject a difference at all. Without them
      # a comparator that always returned "equal" would leave CI green and every
      # claim in the README meaningless.
      - name: Unit tests
        run: python tests/test_trace_format.py

      # Renode is installed OUTSIDE the workspace. It used to be unpacked into
      # ./renode, which is also where this project's own peripheral scripts
      # live, so the cache covered them: the archive saved on the first green
      # run carried renode/sensor.py, and every later run restored that stale
      # copy over the checkout. Nothing failed - the old script just answered
      # every offset with a sensor sample - so measurements were quietly taken
      # against code that was not in the tree. Keeping the installation out of
      # the repository makes that class of bug impossible rather than fixed.
      - name: Cache Renode
        id: cache-renode
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/renode
          key: renode-${{ env.RENODE_VERSION }}-linux-portable-dotnet-v3

      - name: Download and verify Renode
        if: steps.cache-renode.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/renode.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable-dotnet.tar.gz"
          echo "${RENODE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/renode"
          tar xf "${archive}" -C "${RUNNER_TEMP}/renode" --strip-components=1

      - name: Install test dependencies
        run: pip install -r "${RUNNER_TEMP}/renode/tests/requirements.txt"

      # Catches any tool that writes into the checkout behind our backs. This is
      # the guard that would have caught the cache overwriting renode/sensor.py.
      - name: Verify tooling did not modify the checkout
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working tree was modified after checkout:"
            git status --porcelain
            git diff
            exit 1
          fi

      # Deliberately goes through scripts/test.sh rather than calling renode-test
      # directly: the path documented in the README is the path CI proves.
      - name: Run Renode test suite
        env:
          RENODE_DIR: ${{ runner.temp }}/renode
        run: scripts/test.sh

      # M2: the emulator's ground truth against the firmware's own count of the
      # inputs it consumed. There is no recorder to compare against yet, but if
      # these two disagree then one of them is wrong, and knowing that now is
      # cheaper than discovering it in M4 with a recorder in between to blame.
      - name: Verify oracle against firmware counts
        env:
          RENODE_DIR: ${{ runner.temp }}/renode
        run: python tools/verify_oracle.py --count 5

      # M3/M4: the check the project is built around. The recorder runs inside
      # the firmware under a cycle budget and a bounded buffer; the oracle
      # watches the same run from outside with neither constraint. One dropped
      # or reordered event and the sequences stop matching.
      - name: Verify recorder against oracle
        env:
          RENODE_DIR: ${{ runner.temp }}/renode
        run: python tools/verify_recorder.py --count 20 --jobs 4

      # The overflow path was written in M3 and had never executed. This builds
      # with an undersized buffer on purpose and asserts the whole chain fires:
      # events dropped, trace flagged truncated, gap record written, and the
      # comparison refusing to call the result a match. It restores the normal
      # build before returning.
      - name: Verify overflow handling
        env:
          RENODE_DIR: ${{ runner.temp }}/renode
        run: python tools/verify_overflow.py

      # M5: reproduce recorded runs from their traces. The replay side is handed
      # a list of values and cannot reach the seed that produced them - the
      # generator refuses to build a replay peripheral containing one.
      #
      # --require-torn is deliberately NOT set yet: the seed list below was
      # measured before the recorder existed, and adding the recorder changed
      # the timing, so those seeds may no longer hit the race. Asserting on a
      # stale list would be asserting on a number nobody has re-measured.
      - name: Replay recorded runs
        env:
          RENODE_DIR: ${{ runner.temp }}/renode
        run: python tools/replay.py --seeds 55,130,145,322,329,374,380

      # Every push runs a short campaign. It deliberately does NOT assert a
      # failure rate: at the measured 1.75%, a 100-seed run sees zero failures
      # about 17% of the time, and a gate that flakes teaches people to ignore
      # CI. What is asserted is that every run produced a verdict - a run we
      # cannot read is a harness failure, not a pass.
      #
      # The 400-seed dispatch run is large enough to assert the race is still
      # reachable: at 1.75%, seeing nothing in 400 runs has probability 0.9825^400,
      # under one in a thousand.
      - name: Measure race failure rate
        env:
          RENODE_DIR: ${{ runner.temp }}/renode
          CAMPAIGN_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.count || '100' }}
          CAMPAIGN_SWEEP: ${{ github.event_name == 'workflow_dispatch' && inputs.sweep || false }}
        run: |
          set -euo pipefail
          args=(--jobs 4 --run-for 0.2 --report build/campaign.json)
          if [[ "${CAMPAIGN_SWEEP}" == "true" ]]; then
            args+=(--sweep 0,64,512,4096 --count "${CAMPAIGN_COUNT}")
          else
            args+=(--count "${CAMPAIGN_COUNT}")
            if [[ "${CAMPAIGN_COUNT}" -ge 400 ]]; then
              args+=(--expect-failures)
            fi
          fi
          python tools/campaign.py "${args[@]}"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: robot-report
          path: |
            report.html
            log.html
            robot_output.xml
            logs/
            snapshots/
            build/campaign.json
            build/recorder/**/*.trace
            build/overflow/**/*.trace
          if-no-files-found: ignore
